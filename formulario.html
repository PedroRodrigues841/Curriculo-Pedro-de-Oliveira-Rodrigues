<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de contato | Pedro Oliveira</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand-block">
          <h1>Pedro de Oliveira Rodrigues</h1>
        </div>
        <nav class="main-nav" aria-label="Menu principal">
          <ul class="nav-list">
            <li><a href="index.html">Início</a></li>
            <li><a href="curriculo.html">Currículo</a></li>
            <li><a class="active" href="formulario.html">Formulário</a></li>
            <li><a href="multimidia.html">Multimídia</a></li>
            <li><a href="graficos.html">Gráficos</a></li>
          </ul>
        </nav>
        <div class="visitor-controls">
          <button class="button button-secondary" id="theme-toggle" type="button" aria-pressed="false">Ativar tema escuro</button>
          <form class="welcome-form" id="welcome-form" hidden>
            <label for="visitor-name">Como podemos chamar você?</label>
            <input id="visitor-name" name="name" type="text" maxlength="60" autocomplete="given-name" required />
            <button class="button button-secondary" type="submit">Salvar nome</button>
          </form>
          <p class="welcome-message" id="welcome-message" role="status" aria-live="polite" hidden></p>
          <p class="storage-feedback" id="storage-feedback" role="status" aria-live="polite"></p>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        <section class="content-panel form-card" aria-labelledby="formulario-titulo">
          <div class="section-header">
            <h2 id="formulario-titulo">Fale comigo</h2>
          </div>

          <form id="contact-form" action="#" method="post" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" placeholder="Digite seu nome" aria-describedby="nome-erro" required />
                <small class="field-error" id="nome-erro"></small>
              </div>

              <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" aria-describedby="email-erro" required />
                <small class="field-error" id="email-erro"></small>
              </div>

              <div class="field">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" aria-describedby="telefone-erro" required />
                <small class="field-error" id="telefone-erro"></small>
              </div>

              <div class="field">
                <label for="data">Data de contato</label>
                <input id="data" name="data" type="date" aria-describedby="data-erro" required />
                <small class="field-error" id="data-erro"></small>
              </div>

              <div class="field full">
                <label for="assunto">Assunto</label>
                <select id="assunto" name="assunto" required>
                  <option value="">Selecione uma opção</option>
                  <option value="projeto">Projeto</option>
                  <option value="duvida">Dúvida</option>
                  <option value="oportunidade">Oportunidade</option>
                  <option value="outro">Outro</option>
                </select>
                <small class="field-error" id="assunto-erro"></small>
              </div>

              <div class="field full">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" aria-describedby="mensagem-erro" required></textarea>
                <small class="field-error" id="mensagem-erro"></small>
              </div>

              <div class="field full">
                <label>Como prefere ser contatado?</label>
                <div class="choice-group" role="radiogroup" aria-label="Preferência de contato" aria-describedby="preferencia-erro">
                  <label for="contato-email"><input id="contato-email" name="preferencia" type="radio" value="email" required /> E-mail</label>
                  <label for="contato-tel"><input id="contato-tel" name="preferencia" type="radio" value="telefone" /> Telefone</label>
                  <label for="contato-whats"><input id="contato-whats" name="preferencia" type="radio" value="whatsapp" /> WhatsApp</label>
                </div>
                <small class="field-error" id="preferencia-erro"></small>
              </div>

              <div class="field full">
                <label for="newsletter">
                  <input id="newsletter" name="newsletter" type="checkbox" /> Desejo receber novidades por e-mail.
                </label>
              </div>
            </div>

            <div class="form-actions">
              <button class="button" type="submit">Enviar mensagem</button>
            </div>
            <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Pedro de Oliveira Rodrigues — todos os direitos reservados.</p>
      </div>
    </footer>
    <script src="js/scripts.js" defer></script>
  </body>
</html>
